name: IA Code Reviewer

on:
  pull_request:
    branches: [ staging ]
    types: [ opened, synchronize ]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install google-genai PyGithub

      - name: Executar Review da IA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python -c "
          import os, github, google.genai as genai

          gh = github.Github(os.getenv('GITHUB_TOKEN'))
          repo = gh.get_repo(os.getenv('REPO_NAME'))
          pr = repo.get_pull(int(os.getenv('PR_NUMBER')))

          diffs = []
          for file in pr.get_files():
              diffs.append(f'Arquivo: {file.filename}\n{file.patch}')
          diff_text = '\n\n'.join(diffs)

          client = genai.Client(api_key=os.getenv('GEMINI_API_KEY'))
          response = client.models.generate_content(
              model='gemini-2.5-flash',
              contents=f'Você é um Code Reviewer Senior. Analise este Diff de PR e faça comentários sobre qualidade, bugs e aprovação para HML:\n\n{diff_text}'
          )

          pr.create_issue_comment(f'### 🤖 Análise do Agente de IA\n\n{response.text}')
          "