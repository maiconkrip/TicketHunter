name: IA Code Reviewer

on:
  pull_request:
    branches: [ staging ]
    types: [ opened, synchronize ]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install google-genai PyGithub

      - name: Executar Review da IA com Fallback
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python -c "
          import os, github
          from google import genai

          # Autenticação GitHub
          auth = github.Auth.Token(os.getenv('GITHUB_TOKEN'))
          gh = github.Github(auth=auth)
          repo = gh.get_repo(os.getenv('REPO_NAME'))
          pr = repo.get_pull(int(os.getenv('PR_NUMBER')))

          # Coleta alterações do PR
          diffs = []
          for file in pr.get_files():
              diffs.append(f'Arquivo: {file.filename}\n{file.patch}')
          diff_text = '\n\n'.join(diffs)

          client = genai.Client(api_key=os.getenv('GEMINI_API_KEY'))

          # Prioridade: 3.7-flash -> 3.5-flash-lite -> 1.5-flash
          models_to_try = ['gemini-3.7-flash', 'gemini-3.5-flash-lite', 'gemini-1.5-flash']
          response = None

          prompt = f'Você é um Code Reviewer Senior. Analise este Diff de PR e faça comentários sobre qualidade, bugs e aprovação para HML:\n\n{diff_text}'

          for model_name in models_to_try:
              try:
                  print(f'Tentando gerar análise com modelo: {model_name}...')
                  response = client.models.generate_content(
                      model=model_name,
                      contents=prompt
                  )
                  print(f'Sucesso com o modelo {model_name}!')
                  break
              except Exception as e:
                  print(f'Falha ao usar {model_name}: {e}. Alternando para o próximo modelo...')

          if response and response.text:
              pr.create_issue_comment(f'### 🤖 Análise do Agente de IA\n\n{response.text}')
          else:
              raise RuntimeError('Não foi possível obter resposta de nenhum modelo configurado.')
          "