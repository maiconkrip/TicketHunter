name: IA Code Reviewer

on:
  pull_request:
    branches: [ staging ]
    types: [ opened, synchronize ]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Garante acesso ao historico completo de commits

      - name: Executar Analise do Diff com Gemini
        uses: google-gemini/review-pull-request-action@v1
        with:
          api-key: ${{ secrets.GEMINI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          model: 'gemini-1.5-flash'
          system-prompt: |
            Você é um Engenheiro de Software Senior e Revisor de Código.
            Sua tarefa é comparar as alterações feitas neste Pull Request com a versão anterior (branch base).
            
            Sua análise deve cobrir:
            1. **Mudanças Significativas:** Resuma o que mudou em relação ao código antigo.
            2. **Análise de Regressão:** Verifique se algo no código novo pode quebrar o código anterior.
            3. **Boas Práticas e Segurança:** Identifique vulnerabilidades, falta de tipagem ou código ineficiente.
            4. **Veredito:** Indique claramente se o PR está aprovado para HML ou se precisa de correções.