<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketHunter - Buscador de Voos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">

    <div class="max-w-3xl mx-auto space-y-6">
        <!-- Cabeçalho -->
        <div class="text-center">
            <h1 class="text-3xl font-extrabold text-emerald-400">✈️ TicketHunter</h1>
            <p class="text-slate-400 text-sm mt-1">Consulte preços de passagens aéreas em tempo real</p>
        </div>

        <!-- Formulário de Busca -->
        <form id="searchForm" class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Origem (IATA)</label>
                <input type="text" id="origem" placeholder="ex: POA" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white uppercase focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Destino (IATA)</label>
                <input type="text" id="destino" placeholder="ex: GRU" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white uppercase focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Data de Ida</label>
                <input type="date" id="dataIda" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div class="md:col-span-3">
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-2.5 rounded-lg transition-colors shadow-lg shadow-emerald-900/40">
                    Buscar Passagens
                </button>
            </div>
        </form>

        <!-- Container de Resultados -->
        <div id="results" class="space-y-3"></div>
    </div>

    <script>
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const origem = document.getElementById('origem').value.trim();
            const destino = document.getElementById('destino').value.trim();
            const dataIda = document.getElementById('dataIda').value;
            const resultsDiv = document.getElementById('results');

            resultsDiv.innerHTML = `<p class="text-center text-slate-400">Buscando as melhores opções de voos...</p>`;

            try {
                const res = await fetch(`http://127.0.0.1:8000/api/voos?origem=${origem}&destino=${destino}&data_ida=${dataIda}`);
                const data = await res.json();

                if (!res.ok) throw new Error(data.detail || 'Erro na requisição');

                if (data.voos.length === 0) {
                    resultsDiv.innerHTML = `<p class="text-center text-amber-400">Nenhum voo encontrado para essa rota/data.</p>`;
                    return;
                }

                resultsDiv.innerHTML = data.voos.map(voo => `
                    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 flex items-center justify-between hover:border-emerald-500/50 transition-all">
                        <div>
                            <p class="font-bold text-lg text-white">${voo.companhia || 'Companhia Indefinida'} <span class="text-xs text-slate-400">(${voo.numero_voo || 'N/A'})</span></p>
                            <p class="text-xs text-slate-400">Escalas: ${voo.escalas === 0 ? 'Direto' : voo.escalas}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-2xl font-black text-emerald-400">R$ ${voo.preco}</p>
                            <span class="text-xs text-slate-500">por passageiro</span>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                resultsDiv.innerHTML = `<p class="text-center text-red-400">Falha ao carregar voos: ${err.message}</p>`;
            }
        });
    </script>
</body>
</html>
